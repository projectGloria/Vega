<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="50%" stop-color="#101422" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <linearGradient id="vegaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="160" cy="120" r="180" fill="url(#glowGrad)" filter="url(#dropGlow)" />
  <circle cx="820" cy="420" r="160" fill="url(#glowGrad)" filter="url(#dropGlow)" />

  <!-- App Window Frame -->
  <g transform="translate(48, 36)">
    <!-- Window Container -->
    <rect width="864" height="448" rx="12" fill="#111524" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Window TitleBar -->
    <rect width="864" height="42" rx="12" fill="#151a2e" />
    <rect y="30" width="864" height="12" fill="#151a2e" />
    <line x1="0" y1="42" x2="864" y2="42" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

    <!-- Brand Star Mark -->
    <path d="M 32 14.5 L 34.3 20.3 L 40.1 22.5 L 34.3 24.7 L 32 30.5 L 29.7 24.7 L 23.9 22.5 L 29.7 20.3 Z" fill="url(#vegaAccent)" />
    
    <!-- Title -->
    <text x="48" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="0.5">Vega</text>
    <rect x="90" y="15" width="38" height="17" rx="8.5" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="98" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">v1.0</text>

    <!-- Subtitle Center -->
    <text x="432" y="26" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Video Downloader — Windows</text>

    <!-- Window Controls -->
    <circle cx="806" cy="21" r="5" fill="#334155" />
    <circle cx="826" cy="21" r="5" fill="#334155" />
    <circle cx="846" cy="21" r="5" fill="#f43f5e" />

    <!-- Left Sidebar -->
    <rect x="0" y="42" width="180" height="406" fill="#0d111d" />
    <line x1="180" y1="42" x2="180" y2="448" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

    <!-- Nav Items -->
    <!-- New Download (Active) -->
    <rect x="12" y="58" width="156" height="34" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <circle cx="30" cy="75" r="4" fill="#38bdf8" />
    <text x="44" y="79" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Download</text>

    <!-- Queue -->
    <text x="44" y="119" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">Queue</text>
    <rect x="142" y="106" width="20" height="16" rx="8" fill="#1e293b" />
    <text x="148" y="118" fill="#64748b" font-family="monospace" font-size="10">2</text>

    <!-- Clipboard Inbox -->
    <text x="44" y="157" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">Clipboard Inbox</text>
    <circle cx="152" cy="153" r="3.5" fill="#38bdf8" />

    <!-- History -->
    <text x="44" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">History</text>

    <!-- Settings -->
    <text x="44" y="233" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">Settings</text>

    <!-- Main Content Area -->
    <g transform="translate(196, 42)">
      <!-- URL Input Bar -->
      <g transform="translate(16, 20)">
        <rect width="620" height="44" rx="10" fill="#171c30" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="16" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>
        <rect x="522" y="7" width="90" height="30" rx="7" fill="url(#vegaAccent)" />
        <text x="567" y="26" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12">Inspect</text>
      </g>

      <!-- Active Download Card -->
      <g transform="translate(16, 80)">
        <rect width="620" height="136" rx="12" fill="#14192b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

        <!-- Media Thumbnail Placeholder -->
        <rect x="14" y="14" width="108" height="68" rx="8" fill="#1e263d" />
        <path d="M 60 42 L 72 48 L 60 54 Z" fill="#64748b" />
        <rect x="80" y="60" width="36" height="16" rx="4" fill="rgba(0,0,0,0.6)" />
        <text x="85" y="72" fill="#e2e8f0" font-family="monospace" font-size="9">03:32</text>

        <!-- Video Title & Host -->
        <text x="134" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13.5">Rick Astley - Never Gonna Give You Up (Official Music Video)</text>
        <text x="134" y="52" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">YouTube • 1080p60 • MP4 • with Subtitles &amp; Thumbnail Art</text>

        <!-- Status Badges -->
        <rect x="134" y="64" width="56" height="18" rx="5" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
        <text x="143" y="77" fill="#38bdf8" font-family="monospace" font-size="10.5">1080p</text>

        <rect x="196" y="64" width="60" height="18" rx="5" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <text x="204" y="77" fill="#10b981" font-family="monospace" font-size="10.5">Music</text>

        <!-- Progress Bar Background -->
        <rect x="14" y="98" width="592" height="6" rx="3" fill="#1f273d" />
        <!-- Progress Bar Fill (72%) -->
        <rect x="14" y="98" width="426" height="6" rx="3" fill="url(#barGrad)" />

        <!-- Live Metrics -->
        <text x="14" y="122" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5">Downloading: 72%</text>
        <text x="130" y="122" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">48.2 MB / 67.0 MB</text>
        <text x="440" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Speed: <tspan fill="#38bdf8">14.8 MB/s</tspan></text>
        <text x="560" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">ETA: 00:04</text>
      </g>

      <!-- Completed Item Card -->
      <g transform="translate(16, 230)">
        <rect width="620" height="74" rx="12" fill="#121626" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

        <rect x="14" y="14" width="72" height="46" rx="6" fill="#1a2033" />
        <text x="43" y="41" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="12">MP3</text>

        <text x="98" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">Lofi Hip Hop Radio - Beats to Relax/Study to</text>
        <text x="98" y="50" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Audio Extracted • 320 kbps MP3 • 142.4 MB • Completed</text>

        <rect x="528" y="24" width="78" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="546" y="41" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Open File</text>
      </g>

      <!-- Quick Tips Pill -->
      <g transform="translate(16, 320)">
        <rect width="620" height="44" rx="10" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
        <text x="20" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12">💡 Quick Tip:</text>
        <text x="92" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Copy any video URL to clipboard or drag links directly into this window.</text>
      </g>
    </g>
  </g>
</svg>
